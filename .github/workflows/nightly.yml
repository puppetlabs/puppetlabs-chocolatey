name: "nightly"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  Spec:
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_ci.yml@main"
    with:
      # patron (a faraday-patron/faraday_middleware transitive dep pulled in by
      # puppet_litmus's winrm chain) needs libcurl dev headers to build its native extension.
      additional_packages: "libcurl4-openssl-dev"
      ruby_version: "3.2"
    secrets: "inherit"

  Acceptance:
    needs: Spec
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_acceptance.yml@main"
    with:
      # Puppet 9 ships no agent for Windows Server 2012 / 2012 R2 (EOL).
      # metadata.json still lists them for Puppet 8 compatibility, so exclude
      # them from the Puppet 9 lane only.
      flags: >-
        --nightly
        --collection-platform-exclude 9:windows-2012
        --collection-platform-exclude 9:windows-2012_r2
      ruby_version: "3.2"
    secrets: "inherit"
